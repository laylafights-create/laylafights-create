name: Zhwii Client - Build (26.2 Fabric)

on:
  push:
    branches: [main, master, develop]
    paths-ignore: ["**.md", ".gitignore"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhwii-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Zhwii Client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Repo không kèm gradle wrapper nên dùng thẳng Gradle 9.x (Loom 1.17 yêu cầu Gradle 9+)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build
        run: gradle --stacktrace build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Zhwii-Client-26.2
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
